name: Backend Server CI & Deploy (Azure App Service Free)

on:
  push:
    branches: [backend, main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install, Type-Check & Build Backend
        working-directory: backend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Prepare Production Package
        working-directory: backend
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          zip -r ../backend-prod.zip dist package.json package-lock.json node_modules

      - name: Deploy to Azure App Service (benchly-api-ewu)
        uses: azure/webapps-deploy@v3
        with:
          app-name: benchly-api-ewu
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend-prod.zip
