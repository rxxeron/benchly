name: Admin Panel CI & Deploy (admin.benchly.live)

on:
  push:
    branches: [admin, main]
    paths:
      - 'admin-web/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - name: Build Admin Web Bundle
        working-directory: admin-web
        env:
          VITE_API_URL: https://api.benchly.live
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Upload Admin Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchly-admin-dist
          path: admin-web/dist

      - name: Deploy to Cloudflare Pages (admin.benchly.live)
        if: env.HAS_CF_TOKEN != '' && env.HAS_CF_ACCOUNT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy admin-web/dist --project-name=benchly-admin --branch=admin
